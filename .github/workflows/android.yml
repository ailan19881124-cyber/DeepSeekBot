name: Android APK

on:
  push:
    branches: [p1-bot-kind]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1'
      - run: pnpm install --frozen-lockfile
      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Assemble APK
        id: assemble
        working-directory: apps/mobile/android
        shell: bash
        env:
          BUILT_IN_HOSTS: ${{ vars.EXPO_PUBLIC_HOSTS }}
          DEFAULT_HOST_URL: ${{ vars.DEFAULT_HOST_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$BUILT_IN_HOSTS" ]]; then
            export EXPO_PUBLIC_HOSTS="$BUILT_IN_HOSTS"
          fi
          if [[ -n "$DEFAULT_HOST_URL" ]]; then
            export EXPO_PUBLIC_DEFAULT_HOST_URL="$DEFAULT_HOST_URL"
          fi
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" &&
                -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Android signing secrets configured. Running assembleRelease."
            umask 077
            keystore=$(mktemp "$RUNNER_TEMP/android-signing.XXXXXX")
            trap 'rm -f -- "$keystore"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            unset ANDROID_KEYSTORE_BASE64
            env "ORG_GRADLE_PROJECT_android.injected.signing.store.file=$keystore" \
                "ORG_GRADLE_PROJECT_android.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
                "ORG_GRADLE_PROJECT_android.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
                "ORG_GRADLE_PROJECT_android.injected.signing.key.password=$ANDROID_KEY_PASSWORD" \
                ./gradlew --no-daemon assembleRelease
            expected_digest=$(keytool -exportcert -keystore "$keystore" -alias "$ANDROID_KEY_ALIAS" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD | sha256sum | cut -d ' ' -f 1)
            for apk in app/build/outputs/apk/release/*.apk; do
              apk_signer=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk")
              actual_digest=$(awk -F ': ' '/^Signer #1 certificate SHA-256 digest:/ { print $2 }' <<< "$apk_signer")
              if [[ "$actual_digest" != "$expected_digest" ]]; then
                echo "::error::Release APK signing certificate does not match the configured keystore."
                exit 1
              fi
            done
            variant=release
            artifact_variant=release
          elif [[ -n "$BUILT_IN_HOSTS" || -n "$DEFAULT_HOST_URL" ]]; then
            echo "::notice::Android signing secrets are incomplete. Building a standalone preview APK with the template debug key."
            unset ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            ./gradlew --no-daemon assembleRelease
            variant=release
            artifact_variant=preview
          else
            echo "::notice::Android signing secrets are incomplete. Running assembleDebug."
            unset ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            ./gradlew --no-daemon assembleDebug
            variant=debug
            artifact_variant=debug
          fi
          ls -lh "app/build/outputs/apk/$variant/"*.apk
          echo "artifact_variant=$artifact_variant" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ steps.assemble.outputs.artifact_variant }}
          path: apps/mobile/android/app/build/outputs/apk/${{ steps.assemble.outputs.variant }}/*.apk
          if-no-files-found: error
          compression-level: 0
